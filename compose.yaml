name: connectsphere
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-connectsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
      POSTGRES_DB: ${POSTGRES_DB:-connectsphere}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
