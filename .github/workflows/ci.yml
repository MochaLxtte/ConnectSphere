name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: connectsphere
          POSTGRES_PASSWORD: connectsphere_ci
          POSTGRES_DB: connectsphere_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U connectsphere -d connectsphere_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://connectsphere:connectsphere_ci@127.0.0.1:5432/connectsphere_test
      TEST_DATABASE_URL: postgresql://connectsphere:connectsphere_ci@127.0.0.1:5432/connectsphere_test
      API_HOST: 127.0.0.1
      API_PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            frontend/coverage/
            backend/coverage/
            playwright-report/
            test-results/
          retention-days: 14
